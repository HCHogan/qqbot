[package]
name = "qqbot"
description = "QQ's official bot API: access tokens, the WebSocket gateway, events and REST calls"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HCHogan/qqbot"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[dependencies]
base64 = "0.23"
# StreamExt and SinkExt, for the WebSocket stream.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
md5 = { package = "md-5", version = "0.11" }
# Its default TLS is rustls with the system's roots.
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "sync", "time"] }
# The gateway's WebSocket client, on the same rustls and system roots.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt"] }
# The listen example shows sessions starting and reconnecting.
tracing-subscriber = "0.3"
